name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@geozelot'
          cache: npm

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check version matches the release tag
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}" || {
            echo "package.json version does not match release tag ${{ github.event.release.tag_name }}"; exit 1; }

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # With a trusted publisher configured on npmjs.com for this repository
      # and workflow, npm authenticates through OIDC; NPM_TOKEN is then only
      # a fallback and the secret can be deleted.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
