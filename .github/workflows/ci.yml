name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The test tooling (vitest 5) needs Node.js 22.12+; older runtimes
        # are covered by the compat job
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build (Node, CommonJS and browser bundles)
        run: npm run build

      - name: Smoke test of the build
        run: npm run test:smoke

  compat:
    name: Node ${{ matrix.node-version }} (runtime)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Supported runtimes the test tooling no longer runs on: build with
        # the current LTS, then run the smoke test of the built package
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22 (build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Setup Node.js ${{ matrix.node-version }} (run)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke test of the build
        run: node test/smoke.mjs

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Results go to the job summary and an artifact, for comparison across runs
      - name: Run benchmarks
        run: npm run bench -- --json bench-results.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.json
