name: Fuzz

# Long mutation-fuzzing runs of the decoders (the regular test suite runs a
# short one). A failure prints its seed; reproduce it locally with
#   FUZZ_SEED=<seed> FUZZ_ITERATIONS=<n> npx vitest run test/fuzz.test.ts
# Then a memory soak of the tile server (bench/soak.ts).

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      iterations:
        description: Mutations per fixture
        default: '20000'
      seed:
        description: Seed (default the run id)
        default: ''

jobs:
  fuzz:
    name: Fuzz decoders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fuzz
        run: |
          echo "FUZZ_SEED=$FUZZ_SEED FUZZ_ITERATIONS=$FUZZ_ITERATIONS"
          npx vitest run test/fuzz.test.ts
        env:
          FUZZ_ITERATIONS: ${{ inputs.iterations || '20000' }}
          FUZZ_SEED: ${{ inputs.seed || github.run_id }}

      # Memory soak: 20,000 random tiles from one TileServer; fails if the
      # heap grows by more than 32 MB after warm-up (runs even if fuzzing failed)
      - name: Memory soak
        if: ${{ !cancelled() }}
        run: node --expose-gc --import tsx bench/soak.ts
